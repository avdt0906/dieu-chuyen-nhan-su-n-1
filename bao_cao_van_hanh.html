ộp báo cáo đóng cửa</span></div><div class=\"card\"><b style=\"color:${flag?'var(--red)':'var(--green)'}\">${flag}</b><span>salon thiếu báo cáo</span></div>`;\n  const ok='<span class=\"badge ok\">Đã nộp</span>',no='<span class=\"badge thieu\">Chưa nộp</span>';\n  const head=multi?`<table class=\"r\"><thead><tr><th class=\"left\">Mã</th><th class=\"left\">Salon</th><th>Mở cửa nộp</th><th>Đóng cửa nộp</th><th>Thiếu mở cửa (ngày)</th><th>Thiếu đóng cửa (ngày)</th><th class=\"left\">Chi tiết</th></tr></thead><tbody>`:\n    `<table class=\"d\"><thead><tr><th class=\"left\">Mã</th><th class=\"left\">Salon</th><th>Báo cáo mở cửa</th><th>Báo cáo đóng cửa</th><th class=\"left\">Trạng thái</th></tr></thead><tbody>`;\n  const rowH=([s,e])=>multi?\n    `<tr><td class=\"left mu\">${s.id}</td><td class=\"left\"><b>${esc(s.code)}</b></td><td>${e.n-e.moMiss}/${e.n}</td><td>${e.n-e.dongMiss}/${e.n}</td><td class=\"${e.moMiss?'thieu':'mu'}\">${e.moMiss||'—'}</td><td class=\"${e.dongMiss?'thieu':'mu'}\">${e.dongMiss||'—'}</td><td class=\"left\">${e.flag?`<details><summary>${e.moMiss+e.dongMiss} lượt thiếu</summary><ul class=\"tk\">${e.moMiss?`<li>Mở cửa: ${e.moList}</li>`:''}${e.dongMiss?`<li>Đóng cửa: ${e.dongList}</li>`:''}</ul></details>`:ok}</td></tr>`:\n    `<tr><td class=\"left mu\">${s.id}</td><td class=\"left\"><b>${esc(s.code)}</b></td><td class=\"${e.moMiss?'thieu':'ok'}\">${e.moMiss?'Chưa nộp':'Đã nộp'}</td><td class=\"${e.dongMiss?'thieu':'ok'}\">${e.dongMiss?'Chưa nộp':'Đã nộp'}</td><td class=\"left\">${e.flag?no:ok}</td></tr>`;\n  const groups={};ev.forEach(x=>(groups[x[0].gdkv]??=[]).push(x));\n  $('out').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([g,v])=>{\n    const f=v.filter(([,e])=>e.flag).length;\n    return `<div class=\"card\"><h2>${esc(g)} GDKV<small>${v.length} salon${f?' · <span style=\"color:var(--red);font-weight:600\">'+f+' cảnh báo</span>':''}</small></h2><div class=\"tw\">${head}`+v.map(rowH).join('')+`</tbody></table></div></div>`
