<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giám sát camera 56 salon</title>
<style>
  :root {
    --bg: #F8FAFC; --panel: #FFFFFF; --panel2: #F8FAFC; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
    --red: #DC2626; --red-bg: #FEF2F2; --red-solid: #DC2626; --green: #059669; --green-bg: #ECFDF5;
    --blue: #2563EB; --blue-bg: #EFF6FF; --amber: #D97706; --amber-bg: #FFFBEB;
    --gold: #2563EB; --card-border: #D7DFEC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px; color: var(--text);
    background-color: #F8FAFC;
    background-image:
      radial-gradient(620px circle at 6% 10%, rgba(96,165,250,.32), transparent 60%),
      radial-gradient(680px circle at 96% 12%, rgba(244,114,182,.26), transparent 60%),
      radial-gradient(720px circle at 45% 105%, rgba(52,211,153,.26), transparent 65%);
    background-repeat: no-repeat;
    background-attachment: fixed;

    font-size: 14px; line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; color: var(--gold); letter-spacing: .02em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 12.5px; }

  .filters { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  .filters .card { margin-bottom: 14px; padding: 12px 16px; }
  .filters .lbl { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; margin-bottom: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .pill {
    padding: 5px 12px; border-radius: 999px; border: 1.5px solid var(--card-border); background: var(--panel);
    color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .pill:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .pill:disabled { opacity: .4; cursor: default; }
  input[type=date] { padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--card-border); background: var(--panel); color: var(--text); font: inherit; font-size: 12.5px; }

  .gdkv-tab {
    padding: 7px 14px; border-radius: 8px; border: 1.5px solid var(--card-border); background: var(--panel);
    cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .gdkv-tab:hover:not(.active) { border-color: var(--gold); color: var(--gold); }
  .gdkv-tab.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .gdkv-tab .cnt { font-weight: 400; opacity: .8; margin-left: 4px; }
  .gdkv-tab.flag { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .gdkv-tab.active.flag { background: var(--red-solid); border-color: var(--red-solid); color: #fff; }

  .card {
    background: var(--panel); border: 1.5px solid var(--card-border); border-top: 4px solid var(--gold); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 16px; box-shadow: 0 3px 10px rgba(15,23,42,.07);
  }
  .card h2 { font-size: 14px; margin: 0 0 10px; color: var(--text); display: flex; justify-content: space-between; gap: 8px; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }

  .kpi { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 16px; }
  .kpi .card { margin: 0; padding: 10px 16px; min-width: 130px; }
  .kpi b { display: block; font-size: 21px; line-height: 1.3; }
  .kpi span { color: var(--muted); font-size: 11.5px; }

  .tw { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 980px; }
  thead th {
    text-align: right; padding: 6px 8px; border-bottom: 2px solid var(--border);
    color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase;
  }
  table { table-layout: fixed; }
  td, th { overflow-wrap: anywhere; }
  th:nth-child(1) { width: 56px } th:nth-child(2) { width: 110px } th:nth-child(3), th:nth-child(4), th:nth-child(5) { width: 70px }
  thead th.left { text-align: left; }
  tbody td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.left { text-align: left; }
  tbody tr:last-child td { border-bottom: 0; }
  td.thieu { background: var(--red-bg); color: var(--red); font-weight: 700; }
  .mu { color: var(--muted); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; }
  .badge.thieu { background: var(--red-bg); color: var(--red); }
  .badge.ok { background: var(--green-bg); color: var(--green); }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  details summary { cursor: pointer; color: var(--blue); font-weight: 600; }
  .tk { margin: 6px 0 2px; padding: 0; list-style: none; font-size: 12px; text-align: left; }
  .tk li { padding: 2px 0; border-bottom: 1px dashed var(--border); }
  .c1 { color: var(--red); font-weight: 700; } .c2 { color: var(--amber); font-weight: 700; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  /* Điện thoại */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  td:nth-child(1), th:nth-child(1) { position: sticky; left: 0; background: var(--panel); z-index: 1; }
  td:nth-child(2), th:nth-child(2) { position: sticky; left: 52px; background: var(--panel); z-index: 1; box-shadow: 1px 0 0 var(--border); }
  @media (max-width: 720px) {
    body { padding: 10px; }
    h1 { font-size: 17px; }
    .filters { gap: 8px; }
    .filters .card { flex: 1 1 100%; min-width: 0 !important; padding: 10px 12px; margin-bottom: 8px; }
    .pill { padding: 6px 11px; font-size: 12.5px; }
    input[type=date] { font-size: 16px; padding: 6px 10px; }
    .kpi { gap: 8px; }
    .kpi .card { flex: 1 1 calc(50% - 8px); min-width: 0; padding: 8px 12px; }
    .gdkv-tab { font-size: 12px; }
    h2 { font-size: 14px; }
    table { font-size: 12px; }
  }

  $('out').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([g,v])=>{
    const f=v.filter(([,e])=>e.flag).length,t=v.reduce((a,[,e])=>a+e.n,0);
    return `<div class="card"><h2>${esc(g)} GDKV<small>${v.length} salon${t?' · <span style="color:var(--red);font-weight:600">'+t+' ticket</span>':''}</small></h2><div class="tw"><table style="min-width:760px"><thead><tr><th class="left">Mã</th><th class="left">Salon</th><th>Tổng</th><th>Cấm</th><th>Lỗi</th><th class="left">Chi tiết ticket</th></tr></thead><tbody>`+
    v.sort((a,b)=>b[1].n-a[1].n||a[0].id-b[0].id).map(([s,e])=>`<tr><td class="left mu">${s.id}</td><td class="left"><b>${esc(s.code)}</b></td><td class="${e.n?'thieu':'mu'}">${e.n||'—'}</td><td class="${e.cam?'c1':'mu'}">${e.cam||'—'}</td><td class="${e.loi?'c2':'mu'}">${e.loi||'—'}</td><td class="left">`+
      (e.n?`<details><summary>${e.n} ticket</summary><ul class="tk">`+e.tk.map(t=>`<li><span class="mu">${t.id} · ${fmt(t.d).slice(0,5)}</span> · <span class="${t.muc==='Cấm'?'c1':'c2'}">${esc(t.muc)}</span> · ${esc(t.loi)}${t.nv?' — <b>'+esc(t.nv)+'</b>':''}${' <span class="badge'+(t.st==='Approved'?' ok':'')+'">'+(ST[t.st]||esc(t.st))+'</span>'}</li>`).join('')+`</ul></details>`:'<span class="mu">—</span>')+`</td></tr>`).join('')+`</tbody></table></div></div>`}).join(''):'<div class="empty">Không có salon</div>';
  document.querySelectorAll('#presets .pill').forEach(b=>b.style.cssText=b.dataset.k===cur?'background:var(--gold);color:#fff;border-color:var(--gold)':'');
}
$('presets').onclick=e=>{const b=e.target.closest('button');if(b){setPre(b.dataset.k);render()}};
dEl.onchange=()=>{if(!dEl.value){setPre('yesterday')}else{cur='';rng={from:dEl.value,to:dEl.value}}render()};
$('gdkv').onclick=e=>{const b=e.target.closest('button');if(b){sel=b.dataset.g;render()}};
render();
</script></body></html>
