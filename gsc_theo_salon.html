<style>

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 980px; }
  thead th {

  td.thieu { background: var(--red-bg); color: var(--red); font-weight: 700; }
  .mu { color: var(--muted); }

const $=id=>document.getElementById(id);
const fmt=d=>d.split('-').reverse().join('/');

const gdkvs=[...new Set(D.salons.map(s=>s.gdkv))];
let sel='Tất cả',cur='yesterday';
const dEl=$('date');dEl.min=D.tu;dEl.max=D.den;dEl.value=D.den;
const addD=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};

let rng={from:D.den,to:D.den};
function setPre(k){cur=k;const p=PRE.find(x=>x[0]===k);rng={from:p[2],to:p[3]};dEl.value=p[2]===p[3]?p[2]:''}
$('presets').innerHTML=PRE.map(p=>`<button class="pill" data-k="${p[0]}">${p[1]} (${rg(p[2],p[3])})</button>`).join('');
$('sub').textContent='Nguồn: ticket "Luồng phản hồi TTCL Giám sát cam" (DB bi.ticket_management) · '+fmt(D.tu)+' → '+fmt(D.den)+' · tính theo ngày gửi, gồm cả ticket thu hồi';
const chiTiet=t=>{const r=[];if(t.mota)r.push('<b>Mô tả:</b> '+esc(t.mota));if(t.sm)r.push('<b>SM:</b> '+esc(t.sm));if(t.kn)r.push('<b>Salon khiếu nại:</b> '+esc(t.kn));if(t.kq)r.push('<b>Kết quả xét:</b> '+esc(t.kq));return r.length?'<div class="ct">'+r.join('<br>')+'</div>':''};
const ST={Approved:'Đã duyệt',UnderReview:'Đang xét duyệt',Recalled:'Thu hồi',Rejected:'Từ chối',Pending:'Chờ xử lý'};
const bySalon={};D.tickets.forEach(t=>(bySalon[t.salon]??=[]).push(t));
function evalRow(s){
  const from=rng.from,to=rng.to;
  const tk=(bySalon[s.code]||[]).filter(t=>t.d>=from&&t.d<=to).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:a.id<b.id?1:-1);
  const cam=tk.filter(t=>t.muc==='Cấm').length,loi=tk.filter(t=>t.muc==='Lỗi').length;
  return {tk,n:tk.length,cam,loi,flag:tk.length>0};
}
function render(){

    return `<button class="gdkv-tab${g===sel?' active':''}${f?' flag':''}" data-g="${esc(g)}">${esc(g==='Tất cả'?g:g+' GDKV')}<span class="cnt">(${x.length} salon${f?', '+tot+' ticket':''})</span></button>`}).join('');
  const n=ev.length,flag=ev.filter(([,e])=>e.flag).length,tot=ev.reduce((a,[,e])=>a+e.n,0),cam=ev.reduce((a,[,e])=>a+e.cam,0),loi=ev.reduce((a,[,e])=>a+e.loi,0);
  $('kpi').innerHTML=`<div class="card"><b>${n}</b><span>salon</span></div><div class="card"><b style="color:${tot?'var(--red)':'var(--green)'}">${tot}</b><span>ticket GSC</span></div><div class="card"><b class="c1">${cam}</b><span>mức Cấm</span></div><div class="card"><b class="c2">${loi}</b><span>mức Lỗi</span></div><div class="card"><b>${flag}/${n}</b><span>salon có ticket</span></div>`;
  const groups={};ev.forEach(x=>(groups[x[0].gdkv]??=[]).push(x));

    return `<div class="card"><h2>${esc(g)} GDKV<small>${v.length} salon${t?' · <span style="color:var(--red);font-weight:600">'+t+' ticket</span>':''}</small></h2><div class="tw"><table style="min-width:760px"><thead><tr><th class="left">Mã</th><th class="left">Salon</th><th>Tổng</th><th>Cấm</th><th>Lỗi</th><th class="left">Chi tiết ticket</th></tr></thead><tbody>`+
    v.sort((a,b)=>b[1].n-a[1].n||a[0].id-b[0].id).map(([s,e])=>`<tr><td class="left mu">${s.id}</td><td class="left"><b>${esc(s.code)}</b></td><td class="${e.n?'thieu':'mu'}">${e.n||'—'}</td><td class="${e.cam?'c1':'mu'}">${e.cam||'—'}</td><td class="${e.loi?'c2':'mu'}">${e.loi||'—'}</td><td class="left">`+
      (e.n?`<details><summary>${e.n} ticket</summary><ul class="tk">`+e.tk.map(t=>`<li><span class="mu">${t.id} · ${fmt(t.d).slice(0,5)}</span> · <span class="${t.muc==='Cấm'?'c1':'c2'}">${esc(t.muc)}</span> · ${esc(t.loi)}${t.nv?' — <b>'+esc(t.nv)+'</b>':''}${' <span class="badge'+(t.st==='Approved'?' ok':'')+'">'+(ST[t.st]||esc(t.st))+'</span>'}${chiTiet(t)}</li>`).join('')+`</ul></details>`:'<span class="mu">—</span>')+`</td></tr>`).join('')+`</tbody></table></div></div>`}).join(''):'<div class="empty">Không có salon</div>';
  document.querySelectorAll('#presets .pill').forEach(b=>b.style.cssText=b.dataset.k===cur?'background:var(--gold);color:#fff;border-color:var(--gold)':'');
}
$('presets').onclick=e=>{const b=e.target.closest('button');if(b){setPre(b.dataset.k);render()}};
dEl.onchange=()=>{if(!dEl.value){setPre('yesterday')}else{cur='';rng={from:dEl.value,to:dEl.value}}render()};
